<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Syntax Community</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f6f6f6;
      --border: rgba(0, 0, 0, 0.1);
      --border-hover: rgba(0, 0, 0, 0.24);
      --text: #141414;
      --muted: rgba(0, 0, 0, 0.58);
      --subtle: rgba(0, 0, 0, 0.4);
      --accent: #456dff;
      --accent-shadow: #3358e6;
      --warn: #d97706;
      --warn-bg: rgba(245, 158, 11, 0.08);
      --warn-border: rgba(245, 158, 11, 0.32);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }
    :root[data-theme='dark'] {
      --bg: #141414;
      --surface: #1a1a1a;
      --surface-2: #222222;
      --border: rgba(255, 255, 255, 0.12);
      --border-hover: rgba(255, 255, 255, 0.28);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.62);
      --subtle: rgba(255, 255, 255, 0.4);
      --accent: #456dff;
      --accent-shadow: #3358e6;
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.1);
      --warn-border: rgba(245, 158, 11, 0.34);
      --shadow: 0 20px 56px rgba(0, 0, 0, 0.65);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; background: transparent; border: 0; }

    /* Sticky Brilliant-calm Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 64px;
      padding: 0 28px;
      display: grid;
      grid-template-columns: auto minmax(0, 440px) auto;
      align-items: center;
      gap: 20px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
    }
    .brand-wordmark {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 1;
    }
    .brand-sub {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }

    /* Raycast-style Search Input */
    .search-wrap {
      position: relative;
      width: 100%;
    }
    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--subtle);
      pointer-events: none;
      display: inline-flex;
    }
    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 36px 0 36px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 120ms ease, background-color 120ms ease;
    }
    .search-input:focus {
      border-color: var(--border-hover);
      background: var(--surface);
    }
    .search-input::placeholder { color: var(--subtle); }
    .kbd {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 600;
      color: var(--subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: background-color 120ms ease, color 120ms ease;
    }
    .icon-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }
    .open-app-btn {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .open-app-btn:hover {
      background: var(--surface-2);
      border-color: var(--border-hover);
    }

    /* Main Content */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 28px 80px;
    }

    /* Brilliant Underline Tabs */
    .tabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 16px;
    }
    .tabs {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .tab {
      position: relative;
      height: 44px;
      padding: 0 2px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      transition: color 120ms ease;
    }
    .tab:hover { color: var(--text); }
    .tab.is-active { color: var(--text); }
    .tab.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2.5px;
      border-radius: 2px 2px 0 0;
      background: var(--text);
    }
    .count-label {
      font-size: 13px;
      color: var(--subtle);
      white-space: nowrap;
    }

    /* Raycast-Store-inspired 3-column Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      text-align: left;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 140ms ease, transform 140ms ease, background-color 140ms ease;
    }
    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      flex-shrink: 0;
      display: block;
    }
    .card-head-text {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .warn-icon {
      display: inline-flex;
      color: var(--warn);
      flex-shrink: 0;
    }
    .card-author {
      font-size: 12px;
      color: var(--subtle);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .official-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    .card-tagline {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--subtle);
      padding-top: 2px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    /* Raycast / Obsidian Detail Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.is-open { display: flex; }
    .modal {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }
    .modal-identity {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .modal-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      flex-shrink: 0;
    }
    .modal-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .modal-meta {
      margin-top: 3px;
      font-size: 13px;
      color: var(--muted);
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .modal-close:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    /* Prominent "Add to Syntax" CTA Bar */
    .cta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .add-btn {
      flex: 1;
      min-width: 180px;
      height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 0 var(--accent-shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter 120ms ease, transform 100ms ease;
    }
    .add-btn:hover { filter: brightness(0.95); }
    .add-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-shadow); }
    .secondary-btn {
      height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 120ms ease;
    }
    .secondary-btn:hover { border-color: var(--border-hover); }

    .modal-desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }
    .core-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid var(--warn-border);
      background: var(--warn-bg);
      font-size: 13px;
      line-height: 1.45;
    }
    .core-notice strong { display: block; font-weight: 600; color: var(--text); }
    .core-notice span { display: block; color: var(--muted); margin-top: 2px; }

    .dep-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 13px;
    }
    .dep-row span { color: var(--muted); }

    details.mcp-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--surface-2);
      font-size: 13px;
    }
    details.mcp-card summary {
      cursor: pointer;
      font-weight: 600;
    }
    details.mcp-card pre {
      margin: 10px 0 0;
      padding: 10px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      overflow-x: auto;
      font-size: 12px;
      color: var(--muted);
    }
    .trust-foot {
      font-size: 12px;
      color: var(--subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      header {
        grid-template-columns: auto 1fr auto;
        padding: 0 14px;
        gap: 10px;
      }
      .brand-sub, .open-app-btn, .kbd { display: none; }
      main { padding: 20px 14px 64px; }
      .grid { grid-template-columns: 1fr; }
      .tabs { gap: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./">
      <span class="brand-wordmark">Syntax</span>
      <span class="brand-sub">Community</span>
    </a>

    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </span>
      <input id="searchInput" class="search-input" type="search" placeholder="Search plugins and courses..." aria-label="Search plugins and courses" />
      <span class="kbd">/</span>
    </div>

    <div class="header-actions">
      <button id="themeBtn" type="button" class="icon-btn" aria-label="Toggle theme" title="Toggle theme"></button>
      <a class="open-app-btn" href="https://i-am-drunk.github.io/syntax/">Open Syntax</a>
    </div>
  </header>

  <main>
    <div class="tabs-bar">
      <div class="tabs" id="kindTabs" role="tablist">
        <button class="tab is-active" data-kind="all" type="button">All</button>
        <button class="tab" data-kind="course" type="button">Courses</button>
        <button class="tab" data-kind="plugin" type="button">Plugins</button>
        <button class="tab" data-kind="embedded-plugin" type="button">Embedded</button>
      </div>
      <span id="countLabel" class="count-label"></span>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div id="modalContent" class="modal"></div>
  </div>

  <script>
    const SYNTAX_APP_URL = 'https://i-am-drunk.github.io/syntax/';
    const KIND_LABELS = { course: 'Course', plugin: 'Plugin', 'embedded-plugin': 'Embedded' };
    const WARN_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    const SUN_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
    const MOON_SVG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
    const FALLBACK_ICON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#252525"/><circle cx="32" cy="32" r="10" fill="#a3a3a3"/></svg>';

    let allPackages = [];
    let state = { kind: 'all', q: '' };

    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('syntax-hub-theme') || 'dark';
    root.dataset.theme = savedTheme;
    function syncThemeIcon() {
      themeBtn.innerHTML = root.dataset.theme === 'dark' ? SUN_SVG : MOON_SVG;
    }
    syncThemeIcon();

    themeBtn.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('syntax-hub-theme', next);
      syncThemeIcon();
    });

    function svgDataUri(svg) {
      const safe = typeof svg === 'string' && svg.trim().startsWith('<svg') && svg.includes('</svg>') && !/<script|<foreignObject|javascript:|\bon[a-z]+\s*=/i.test(svg)
        ? svg.trim()
        : FALLBACK_ICON_SVG;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(safe);
    }

    function esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function closeDetail() {
      document.getElementById('modalBackdrop').classList.remove('is-open');
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    }

    function openDetail(pkg) {
      const backdrop = document.getElementById('modalBackdrop');
      const box = document.getElementById('modalContent');
      const deepLink = SYNTAX_APP_URL + '?install=' + encodeURIComponent(pkg.id);
      const fileHref = './packages/' + encodeURIComponent(pkg.id + pkg.extension);
      if (location.hash !== '#' + pkg.id) {
        history.replaceState(null, '', '#' + pkg.id);
      }

      box.innerHTML = `
        <div class="modal-head">
          <div class="modal-identity">
            <img class="modal-icon" src="${svgDataUri(pkg.iconSvg)}" alt="" />
            <div>
              <h2 class="modal-title">${esc(pkg.name)}</h2>
              <div class="modal-meta">@${esc(pkg.author.handle)} &middot; v${esc(pkg.version)}</div>
            </div>
          </div>
          <button id="closeModalBtn" type="button" class="modal-close" aria-label="Close">&times;</button>
        </div>

        <div class="cta-row">
          <a class="add-btn" href="${deepLink}">Add to Syntax</a>
          <button id="copyLinkBtn" type="button" class="secondary-btn">Copy link</button>
          <a class="secondary-btn" href="${fileHref}" download>Download</a>
        </div>

        <p class="modal-desc">${esc(pkg.description)}</p>

        ${pkg.touchesCore ? `
          <div class="core-notice">
            <span class="warn-icon" style="margin-top:2px;">${WARN_SVG}</span>
            <div>
              <strong>This plugin touches core.</strong>
              <span>${esc(pkg.coreTouchReason || 'Integrates directly into core Syntax surfaces.')}</span>
            </div>
          </div>
        ` : ''}

        ${pkg.requires && pkg.requires.length ? `
          <div class="dep-row">
            <strong>Includes embedded plugin</strong>
            <span>${esc(pkg.requires.map(r => r.name).join(', '))}</span>
          </div>
        ` : ''}

        ${pkg.aiUsage ? `
          <details class="mcp-card">
            <summary>AI usage (MCP)</summary>
            <p class="modal-desc" style="margin-top:8px;font-size:13px;">${esc(pkg.aiUsage.summary)}</p>
            <pre>${esc(pkg.aiUsage.example)}</pre>
          </details>
        ` : ''}

        <div class="trust-foot">
          <span>${esc(pkg.extension)}</span>
          <span>${pkg.safety.automatedScan === 'passed' ? 'Scan passed' : 'Unverified'} &middot; ${pkg.touchesCore ? 'Core' : 'Sandboxed'}</span>
        </div>
      `;

      backdrop.classList.add('is-open');
      document.getElementById('closeModalBtn').addEventListener('click', closeDetail);
      const copyBtn = document.getElementById('copyLinkBtn');
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          copyBtn.textContent = 'Copied';
          setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1500);
        } catch {}
      });
    }

    document.getElementById('modalBackdrop').addEventListener('click', e => {
      if (e.target.id === 'modalBackdrop') closeDetail();
    });

    function render() {
      const q = state.q.trim().toLowerCase();
      const filtered = allPackages.filter(pkg => {
        if (state.kind !== 'all' && pkg.kind !== state.kind) return false;
        if (q) {
          const hay = (pkg.name + ' ' + pkg.tagline + ' ' + pkg.author.handle + ' ' + (pkg.tags || []).join(' ')).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById('countLabel').textContent =
        filtered.length + (filtered.length === 1 ? ' item' : ' items');

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No packages match your search.</div>';
        return;
      }

      for (const pkg of filtered) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <img class="icon-box" src="${svgDataUri(pkg.iconSvg)}" alt="" />
            <div class="card-head-text">
              <div class="card-title-row">
                <span class="card-title">${esc(pkg.name)}</span>
                ${pkg.touchesCore ? `<span class="warn-icon" title="This plugin touches core." aria-label="This plugin touches core.">${WARN_SVG}</span>` : ''}
              </div>
              <span class="card-author">
                ${pkg.author.official ? '<span class="official-dot" title="Official"></span>' : ''}
                @${esc(pkg.author.handle)}
              </span>
            </div>
          </div>
          <p class="card-tagline">${esc(pkg.tagline)}</p>
          <div class="card-foot">
            <span>${esc(KIND_LABELS[pkg.kind] || pkg.kind)}</span>
            <span>v${esc(pkg.version)}</span>
          </div>
        `;
        card.addEventListener('click', () => openDetail(pkg));
        grid.appendChild(card);
      }
    }

    document.getElementById('kindTabs').addEventListener('click', e => {
      const btn = e.target.closest('[data-kind]');
      if (!btn) return;
      state.kind = btn.dataset.kind;
      document.querySelectorAll('#kindTabs .tab').forEach(t => t.classList.toggle('is-active', t === btn));
      render();
    });

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
      state.q = searchInput.value;
      render();
    });

    window.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape') {
        if (document.getElementById('modalBackdrop').classList.contains('is-open')) {
          closeDetail();
        } else if (document.activeElement === searchInput) {
          searchInput.value = '';
          state.q = '';
          searchInput.blur();
          render();
        }
      }
    });

    fetch('./catalog/catalog.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        allPackages = data.packages || [];
        render();
        const hashId = location.hash.replace(/^#/, '');
        if (hashId) {
          const found = allPackages.find(p => p.id === hashId);
          if (found) openDetail(found);
        }
      })
      .catch(() => {
        document.getElementById('countLabel').textContent = 'Unavailable';
      });
  </script>
</body>
</html>
