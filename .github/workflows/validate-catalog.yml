name: Validate Syntax Catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog, schemas, security rules, and SHA-256 checksums
        run: node scripts/validate-catalog.mjs
