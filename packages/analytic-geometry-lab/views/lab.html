<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytic Geometry Lab</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--surface, #ffffff);
        color: var(--text, #111111);
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, sans-serif);
        -webkit-font-smoothing: antialiased;
      }
      .shell {
        max-width: 1040px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.9fr);
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 820px) {
        .shell { grid-template-columns: 1fr; padding: 14px; }
      }
      .card {
        border: 1.5px solid var(--border, rgba(0,0,0,0.1));
        border-radius: 16px;
        background: var(--surface, #fff);
        padding: 16px;
      }
      :root[data-theme='dark'] .card {
        background: #181818;
        border-color: #2c2c2c;
      }
      .board-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        max-height: 520px;
        border-radius: 12px;
        overflow: hidden;
        background: var(--secondary, #f7f7f7);
        touch-action: none;
        user-select: none;
      }
      :root[data-theme='dark'] .board-wrap { background: #121212; }
      svg.plane { width: 100%; height: 100%; display: block; }
      .handle { cursor: grab; }
      .handle:active { cursor: grabbing; }
      .stack { display: flex; flex-direction: column; gap: 14px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: var(--secondary, #f2f2f2);
        color: var(--muted, #666);
      }
      .badge.is-pass {
        background: rgba(34, 197, 94, 0.16);
        color: #16a34a;
      }
      :root[data-theme='dark'] .badge.is-pass { color: #4ade80; }
      .challenge-title {
        margin: 8px 0 4px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.35;
      }
      .muted { margin: 0; font-size: 13px; color: var(--muted, #666); line-height: 1.45; }
      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .metric {
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border, rgba(0,0,0,0.1));
        background: var(--secondary, #f8f8f8);
      }
      :root[data-theme='dark'] .metric { background: #141414; border-color: #2a2a2a; }
      .metric span { display: block; font-size: 11.5px; color: var(--muted, #666); font-weight: 600; }
      .metric strong {
        display: block;
        margin-top: 3px;
        font-size: 16px;
        font-weight: 700;
        font-family: var(--font-mono, ui-monospace, monospace);
      }
      .metric.wide { grid-column: 1 / -1; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--border, rgba(0,0,0,0.12));
        background: var(--surface, #fff);
        color: var(--text, #111);
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
      }
      :root[data-theme='dark'] .btn { background: #222; border-color: #353535; color: #fff; }
      .btn:hover { filter: brightness(1.06); }
      .btn.primary {
        background: #456dff;
        border-color: #456dff;
        color: #fff;
      }
      .status-line { font-size: 12.5px; color: var(--muted, #666); min-height: 18px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="row" style="margin-bottom: 10px">
          <strong style="font-size: 15px">Coordinate Plane</strong>
          <span class="badge" id="coords-badge">A(-2, -1) · B(2, 3)</span>
        </div>
        <div class="board-wrap">
          <svg id="plane" class="plane" viewBox="0 0 420 420" aria-label="Interactive coordinate plane"></svg>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="row">
            <span class="badge" id="challenge-counter">Challenge 1 / 5</span>
            <span class="badge" id="challenge-status">In progress</span>
          </div>
          <p class="challenge-title" id="challenge-prompt">Loading challenge...</p>
          <p class="muted" id="challenge-hint"></p>
          <div class="row" style="margin-top: 12px">
            <button type="button" class="btn primary" id="next-btn">Next challenge</button>
            <button type="button" class="btn" id="reset-btn">Reset points</button>
          </div>
        </div>

        <div class="card">
          <div class="metrics">
            <div class="metric wide">
              <span>Line Equation</span>
              <strong id="m-eq">y = x + 1</strong>
            </div>
            <div class="metric">
              <span>Slope (m)</span>
              <strong id="m-slope">1</strong>
            </div>
            <div class="metric">
              <span>Distance (d)</span>
              <strong id="m-dist">5.66</strong>
            </div>
            <div class="metric wide">
              <span>Midpoint (M)</span>
              <strong id="m-mid">(0, 1)</strong>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <strong style="font-size: 14px">Workspace Snapshots</strong>
            <button type="button" class="btn" id="save-btn">Save snapshot</button>
          </div>
          <p class="status-line" id="save-status" style="margin-top: 8px">
            Saves directly to your Syntax Library Documents.
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import { connectSyntaxView } from 'https://syntax-platform.github.io/syntax-dev/sdk/syntax-view-v1.js'

      const SIZE = 420
      const RANGE = 6
      const STEP = SIZE / (RANGE * 2)
      const HALF = SIZE / 2

      let state = { ax: -2, ay: -1, bx: 2, by: 3 }
      let settings = { gridSnap: true, showTriangle: true, showMidpoint: true }
      let dragging = null
      let view = null
      let activeDocId = null

      const svg = document.getElementById('plane')
      const fmt = n => (Math.abs(n - Math.round(n)) < 0.005 ? String(Math.round(n)) : n.toFixed(2))
      const toSvgX = x => HALF + x * STEP
      const toSvgY = y => HALF - y * STEP
      const clamp = v => Math.max(-RANGE, Math.min(RANGE, v))

      function renderPlane(evalResult) {
        const isDark = document.documentElement.dataset.theme === 'dark'
        const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)'
        const axisColor = isDark ? 'rgba(255,255,255,0.34)' : 'rgba(0,0,0,0.35)'
        const labelColor = isDark ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.45)'
        const lineColor = evalResult?.passed ? '#22c55e' : '#456dff'

        let html = ''
        for (let i = -RANGE; i <= RANGE; i++) {
          const px = toSvgX(i)
          const py = toSvgY(i)
          html += `<line x1="${px}" y1="0" x2="${px}" y2="${SIZE}" stroke="${i === 0 ? axisColor : gridColor}" stroke-width="${i === 0 ? 1.5 : 1}"/>`
          html += `<line x1="0" y1="${py}" x2="${SIZE}" y2="${py}" stroke="${i === 0 ? axisColor : gridColor}" stroke-width="${i === 0 ? 1.5 : 1}"/>`
          if (i !== 0 && i % 2 === 0) {
            html += `<text x="${px + 3}" y="${HALF + 13}" fill="${labelColor}" font-size="10">${i}</text>`
            html += `<text x="${HALF + 5}" y="${py + 3}" fill="${labelColor}" font-size="10">${i}</text>`
          }
        }

        const x1 = toSvgX(state.ax), y1 = toSvgY(state.ay)
        const x2 = toSvgX(state.bx), y2 = toSvgY(state.by)

        // Extended line
        if (Math.abs(state.bx - state.ax) < 1e-6) {
          html += `<line x1="${x1}" y1="0" x2="${x1}" y2="${SIZE}" stroke="${lineColor}" stroke-width="2" opacity="0.3"/>`
        } else {
          const m = (state.by - state.ay) / (state.bx - state.ax)
          const b = state.ay - m * state.ax
          const lx1 = -RANGE, ly1 = m * lx1 + b
          const lx2 = RANGE, ly2 = m * lx2 + b
          html += `<line x1="${toSvgX(lx1)}" y1="${toSvgY(ly1)}" x2="${toSvgX(lx2)}" y2="${toSvgY(ly2)}" stroke="${lineColor}" stroke-width="2" opacity="0.28"/>`
        }

        // Rise / run triangle
        if (settings.showTriangle) {
          html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y1}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>`
          html += `<line x1="${x2}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4"/>`
        }

        // Segment AB
        html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lineColor}" stroke-width="3.5" stroke-linecap="round"/>`

        // Midpoint
        if (settings.showMidpoint) {
          const mx = toSvgX((state.ax + state.bx) / 2)
          const my = toSvgY((state.ay + state.by) / 2)
          html += `<circle cx="${mx}" cy="${my}" r="5" fill="#f59e0b" stroke="${isDark ? '#121212' : '#fff'}" stroke-width="2"/>`
        }

        // Draggable points A & B
        html += `<g class="handle" data-pt="a"><circle cx="${x1}" cy="${y1}" r="16" fill="transparent"/><circle cx="${x1}" cy="${y1}" r="8" fill="#456dff" stroke="#fff" stroke-width="2.5"/><text x="${x1}" y="${y1 - 12}" text-anchor="middle" fill="${isDark ? '#fff' : '#111'}" font-size="12" font-weight="700">A</text></g>`
        html += `<g class="handle" data-pt="b"><circle cx="${x2}" cy="${y2}" r="16" fill="transparent"/><circle cx="${x2}" cy="${y2}" r="8" fill="#ec4899" stroke="#fff" stroke-width="2.5"/><text x="${x2}" y="${y2 - 12}" text-anchor="middle" fill="${isDark ? '#fff' : '#111'}" font-size="12" font-weight="700">B</text></g>`

        svg.innerHTML = html
        document.getElementById('coords-badge').textContent = `A(${fmt(state.ax)}, ${fmt(state.ay)}) · B(${fmt(state.bx)}, ${fmt(state.by)})`
      }

      async function syncEval() {
        if (!view) return renderPlane(null)
        const res = await view.callWorker('evaluateGeometry', state)
        renderPlane(res)
        document.getElementById('m-slope').textContent = res.isVertical ? 'undefined' : fmt(res.slope)
        document.getElementById('m-dist').textContent = fmt(res.distance)
        document.getElementById('m-mid').textContent = `(${fmt(res.midX)}, ${fmt(res.midY)})`
        if (res.isVertical) {
          document.getElementById('m-eq').textContent = `x = ${fmt(state.ax)}`
        } else {
          const bSign = res.intercept >= 0 ? '+' : '-'
          document.getElementById('m-eq').textContent = `y = ${fmt(res.slope)}x ${bSign} ${fmt(Math.abs(res.intercept))}`
        }
        const c = res.challenge
        document.getElementById('challenge-counter').textContent = `Challenge ${c.index + 1} / ${c.total} · ${c.solvedCount} solved`
        document.getElementById('challenge-prompt').textContent = c.prompt
        document.getElementById('challenge-hint').textContent = c.hint
        const st = document.getElementById('challenge-status')
        st.textContent = res.passed ? 'Solved!' : 'In progress'
        st.className = res.passed ? 'badge is-pass' : 'badge'
      }

      svg.addEventListener('pointerdown', e => {
        const g = e.target.closest('[data-pt]')
        if (!g) return
        dragging = g.getAttribute('data-pt')
        svg.setPointerCapture(e.pointerId)
      })
      svg.addEventListener('pointermove', e => {
        if (!dragging) return
        const rect = svg.getBoundingClientRect()
        const sx = ((e.clientX - rect.left) / rect.width) * SIZE
        const sy = ((e.clientY - rect.top) / rect.height) * SIZE
        let x = clamp((sx - HALF) / STEP)
        let y = clamp((HALF - sy) / STEP)
        if (settings.gridSnap) {
          x = Math.round(x)
          y = Math.round(y)
        } else {
          x = Math.round(x * 4) / 4
          y = Math.round(y * 4) / 4
        }
        if (dragging === 'a') { state.ax = x; state.ay = y }
        else { state.bx = x; state.by = y }
        void syncEval()
      })
      svg.addEventListener('pointerup', () => { dragging = null })

      document.getElementById('next-btn').addEventListener('click', async () => {
        if (!view) return
        await view.callWorker('nextChallenge')
        await syncEval()
      })
      document.getElementById('reset-btn').addEventListener('click', () => {
        state = { ax: -2, ay: -1, bx: 2, by: 3 }
        void syncEval()
      })
      document.getElementById('save-btn').addEventListener('click', async () => {
        if (!view) return
        const title = `Line A(${fmt(state.ax)},${fmt(state.ay)}) to B(${fmt(state.bx)},${fmt(state.by)})`
        const doc = await view.documents.create({
          type: 'geometry-snapshot',
          title,
          data: { ...state },
        })
        activeDocId = doc.id
        document.getElementById('save-status').textContent = `Saved "${doc.title}" to Library Documents.`
      })

      view = await connectSyntaxView({
        applyTheme: true,
        onTheme: () => renderPlane(null),
        onSettings: next => {
          settings = { ...settings, ...next }
          void syncEval()
        },
      })
      settings = { ...settings, ...(view.getSettings() || {}) }

      if (view.docId) {
        const doc = await view.documents.get(view.docId)
        if (doc && doc.data && typeof doc.data.ax === 'number') {
          activeDocId = doc.id
          state = { ax: doc.data.ax, ay: doc.data.ay, bx: doc.data.bx, by: doc.data.by }
          document.getElementById('save-status').textContent = `Loaded snapshot "${doc.title}".`
        }
      }

      await syncEval()
    </script>
  </body>
</html>
